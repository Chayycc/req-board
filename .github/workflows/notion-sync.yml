name: Notion ⇄ Board sync

# Every 5 min: pull new/updated requests Notion -> board (descriptive fields),
# and push board -> Notion (status/priority/dates/note edits, changed items only).
# See sync_notion.py. Board is authoritative for workflow fields, Notion for descriptive.

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes = GitHub Actions' minimum (may still delay under load)
  workflow_dispatch: {}        # allow manual run from the Actions tab

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Notion → Supabase
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python sync_notion.py
